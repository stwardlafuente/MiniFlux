# Bright Agent (STAR) — GitHub Actions
# Generated by the STAR Workflow Builder. Commit to your repo's DEFAULT branch
# (required for /bright-agent comment steering to trigger).

name: Bright Agent (SAST Validation)

on:
  workflow_dispatch:

permissions:
  contents: write        # commit fixes to the branch
  pull-requests: write   # open/update the PR + summary comment
  statuses: write        # set the "Bright Agent" commit status
  security-events: read

concurrency:
  group: bright-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  bright-agent:
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ASSET: bright-agent-linux-x64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze (write SARIF to temp)
        uses: github/codeql-action/analyze@v3
        with:
          output: ${{ runner.temp }}/sarif
          upload: never
      - name: Download & verify Bright Agent
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/NeuraLegion/bright-agent-dist/releases/latest/download"
          curl -fsSL -o "${ASSET}" "${base}/${ASSET}"
          curl -fsSL -o "${ASSET}.sha256" "${base}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          chmod +x "${ASSET}"
      - name: Run Bright Agent
        env:
          LOCAL_REPO_PATH: ${{ github.workspace }}
          REPO_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          INFERENCE_URL: "https://api.anthropic.com/v1"
          INFERENCE_TOKEN: ${{ secrets.INFERENCE_TOKEN }}
          RUN_MODE: validation
          SARIF_PATH: ${{ runner.temp }}/sarif/go.sarif
          AI_MODEL: "claude-sonnet-5,claude-opus-4-8"
          BRIGHT_DEBUG: "1"
          BRIGHT_DUMP_TURNS: "1"
          BRIGHT_DUMP_DIR: "${{ runner.temp }}/bright-agent-turn-dumps"
        run: "${{ runner.temp }}/${{ env.ASSET }}"

      - name: Upload Bright Agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-logs
          path: ~/.bright-agent/logs/
          if-no-files-found: ignore

      - name: Upload Bright Agent LLM turn dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-turn-dumps
          path: ${{ runner.temp }}/bright-agent-turn-dumps/
          if-no-files-found: ignore

# NOTE: commits/PRs made with GITHUB_TOKEN don't trigger your other workflows.
# Use a PAT as REPO_ACCESS_TOKEN if you need fix commits to re-run CI.
